# NebulaOS Kernel Configuration
# ==============================
#
# Build configuration for NebulaOS kernel
# This file is included by both the Makefile and C headers

# -----------------------------------------------------------------------------
# Version Information
# -----------------------------------------------------------------------------

VERSION=0.0.1
AUTHOR=NebulaOS Team
CODENAME=Stardust

# -----------------------------------------------------------------------------
# Architecture
# -----------------------------------------------------------------------------

# Supported architectures: x86, x86_64
DEFAULT_ARCH=x86_64

# -----------------------------------------------------------------------------
# Kernel Features
# -----------------------------------------------------------------------------

# Enable VGA text mode driver
FEATURE_VGA=1

# Enable keyboard driver
FEATURE_KEYBOARD=1

# Enable mouse driver
FEATURE_MOUSE=1

# Enable PIT timer
FEATURE_PIT=1

# Enable PIC driver
FEATURE_PIC=1

# Enable memory management
FEATURE_MM=1

# Enable shell
FEATURE_SHELL=1

# Enable GUI (text mode only for now)
FEATURE_GUI=0

# -----------------------------------------------------------------------------
# Build Options
# -----------------------------------------------------------------------------

# Optimization level (0, 1, 2, 3, s)
OPT_LEVEL=2

# Enable debug symbols
DEBUG=0

# Enable warnings as errors
WERROR=0

# -----------------------------------------------------------------------------
# C Definitions (for C headers)
# -----------------------------------------------------------------------------

#define NEBULAOS_VERSION "0.0.1"
#define NEBULAOS_NAME "NebulaOS"
#define NEBULAOS_CODENAME "Stardust"
#define NEBULAOS_AUTHOR "NebulaOS Team"

#ifdef NEBULAOS_ARCH_X86
#define NEBULAOS_ARCH_STR "x86"
#else
#define NEBULAOS_ARCH_STR "x86_64"
#endif

#define NEBULAOS_DEFAULT_MODE 64

#define FEATURE_VGA_ENABLED 1
#define FEATURE_KEYBOARD_ENABLED 1
#define FEATURE_MOUSE_ENABLED 1
#define FEATURE_PIT_ENABLED 1
#define FEATURE_PIC_ENABLED 1
#define FEATURE_MM_ENABLED 1
#define FEATURE_SHELL_ENABLED 1
#define FEATURE_GUI_ENABLED 0
