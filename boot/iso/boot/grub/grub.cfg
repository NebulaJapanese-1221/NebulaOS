serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
set gfxmode=1024x768x32;auto
set gfxpayload=keep
insmod vbe
insmod gfxterm
terminal_input console serial
terminal_output gfxterm serial
set timeout=5
set timeout_style=menu
set default=0

menuentry "NebulaOS" {
    multiboot2 /boot/kernel.elf
}
