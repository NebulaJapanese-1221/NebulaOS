[build]
# Default target - change to i686-nebula.json for 32-bit builds
# Use `make` for x86 or `make ARCH=x86_64` for 64-bit to build correctly
target = "x86_64-nebula.json"

[unstable]
# Automatically build core and alloc for the target, avoiding host std conflicts
build-std = ["core", "alloc"]
build-std-features = ["compiler-builtins-mem"]
